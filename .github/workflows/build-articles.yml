name: Build Technical Articles

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "source/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/build-articles.yml"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find article directories
        id: set-matrix
        shell: bash
        run: |
          articles=$(find source -type f -name "article.tex" -printf '%h\n' | sort -u)

          matrix=$(printf '%s\n' "$articles" \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      matrix:
        article_dir: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get article ID and series
        id: article
        shell: bash
        run: |
          article_id=$(basename "${{ matrix.article_dir }}")
          series=$(basename "$(dirname "${{ matrix.article_dir }}")")

          echo "id=$article_id" >> "$GITHUB_OUTPUT"
          echo "series=$series" >> "$GITHUB_OUTPUT"

      - name: Compile article
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            cd "${{ matrix.article_dir }}"

            pdflatex -interaction=nonstopmode -halt-on-error article.tex
            pdflatex -interaction=nonstopmode -halt-on-error article.tex

            article_id=$(basename "${{ matrix.article_dir }}")

            mv article.pdf "${article_id}.pdf"

      - name: Generate HTML article
        shell: bash
        run: |
          python scripts/build_article.py "${{ matrix.article_dir }}"

      - name: Copy PDF to article folder
        shell: bash
        run: |
          article_id="${{ steps.article.outputs.id }}"
          series="${{ steps.article.outputs.series }}"

          mkdir -p "articles/$series/$article_id"

          cp \
            "${{ matrix.article_dir }}/${article_id}.pdf" \
            "articles/$series/$article_id/${article_id}.pdf"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.article.outputs.id }}
          path: ${{ matrix.article_dir }}/*.pdf
          if-no-files-found: error

      - name: Commit generated article files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          article_id="${{ steps.article.outputs.id }}"
          series="${{ steps.article.outputs.series }}"

          git add "articles/$series/$article_id"

          if git diff --cached --quiet; then
            echo "No generated article changes to commit."
          else
            git commit -m "Build ${article_id} article"
            git push
          fi
