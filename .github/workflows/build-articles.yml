name: Build Technical Articles

# Each article is compiled only when its source changes. Shared HTML templates
# regenerate HTML without LaTeX, and listing-script edits skip article builds.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "source/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/build-articles.yml"
  pull_request:
    branches:
      - main
    paths:
      - "source/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/build-articles.yml"

# Serialize publication runs for main, without serializing individual articles.
concurrency:
  group: build-technical-articles-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Detect changed articles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.articles.outputs.matrix }}
      has_builds: ${{ steps.articles.outputs.has_builds }}

    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select articles and build mode
        id: articles
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mapfile -t all_articles < <(
            find source -mindepth 3 -maxdepth 3 -type f -name article.tex -printf '%h\n' | LC_ALL=C sort
          )

          declare -A build_mode=()
          full_rebuild=false
          html_rebuild=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            full_rebuild=true
          else
            base="$PREVIOUS_SHA"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE_SHA"
            fi

            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              full_rebuild=true
            else
              while IFS= read -r -d '' file; do
                case "$file" in
                  source/*/*/*)
                    IFS=/ read -r root series article remainder <<< "$file"
                    article_dir="source/$series/$article"
                    if [[ -f "$article_dir/article.tex" ]]; then
                      build_mode["$article_dir"]="pdf"
                    fi
                    ;;
                  templates/*|scripts/build_article.py)
                    html_rebuild=true
                    ;;
                  scripts/update_latest_articles.py|scripts/update_series_articles.py)
                    # Listing changes need only the final publishing job.
                    ;;
                  scripts/*)
                    # Unknown publishing helper changes conservatively regenerate HTML.
                    html_rebuild=true
                    ;;
                  .github/workflows/build-articles.yml)
                    # Smoke-test the complete pipeline after workflow changes.
                    full_rebuild=true
                    ;;
                esac
              done < <(git diff --name-only -z "$base" "$CURRENT_SHA")
            fi
          fi

          if [[ "$full_rebuild" == true ]]; then
            for dir in "${all_articles[@]}"; do
              build_mode["$dir"]="pdf"
            done
          elif [[ "$html_rebuild" == true ]]; then
            for dir in "${all_articles[@]}"; do
              if [[ -z "${build_mode[$dir]+x}" ]]; then
                build_mode["$dir"]="html"
              fi
            done
          fi

          matrix="$(
            for dir in "${!build_mode[@]}"; do
              printf '%s\t%s\n' "$dir" "${build_mode[$dir]}"
            done | LC_ALL=C sort | jq -R -s -c '
              [split("\n")[] | select(length > 0) | split("\t") |
               {dir: .[0], mode: .[1]}]'
          )"

          echo "Selected article builds: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == "[]" ]]; then
            echo "has_builds=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_builds=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate publishing Python scripts
        run: python -m py_compile scripts/build_article.py scripts/update_latest_articles.py scripts/update_series_articles.py

  build:
    name: Build ${{ matrix.article.dir }} (${{ matrix.article.mode }})
    needs: discover
    if: needs.discover.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        article: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Identify article
        id: article
        shell: bash
        env:
          ARTICLE_DIR: ${{ matrix.article.dir }}
        run: |
          echo "id=$(basename "$ARTICLE_DIR")" >> "$GITHUB_OUTPUT"
          echo "series=$(basename "$(dirname "$ARTICLE_DIR")")" >> "$GITHUB_OUTPUT"

      - name: Compile PDF (source changes only)
        if: matrix.article.mode == 'pdf'
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            cd "${{ matrix.article.dir }}"
            pdflatex -interaction=nonstopmode -halt-on-error article.tex
            pdflatex -interaction=nonstopmode -halt-on-error article.tex
            mv article.pdf "${{ steps.article.outputs.id }}.pdf"

      - name: Generate HTML
        run: python scripts/build_article.py "${{ matrix.article.dir }}"

      - name: Copy updated PDF
        if: matrix.article.mode == 'pdf'
        shell: bash
        run: |
          series="${{ steps.article.outputs.series }}"
          article="${{ steps.article.outputs.id }}"
          cp "${{ matrix.article.dir }}/$article.pdf" "articles/$series/$article/$article.pdf"

      - name: Stage generated article under its final path
        shell: bash
        run: |
          series="${{ steps.article.outputs.series }}"
          article="${{ steps.article.outputs.id }}"
          target="$RUNNER_TEMP/staged/articles/$series/$article"
          mkdir -p "$target"
          cp -a "articles/$series/$article/." "$target/"

      - name: Upload generated article files
        uses: actions/upload-artifact@v4
        with:
          name: built-${{ steps.article.outputs.series }}-${{ steps.article.outputs.id }}
          path: ${{ runner.temp }}/staged/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish articles and refresh listings
    needs: [discover, build]
    if: >
      always() &&
      github.event_name != 'pull_request' &&
      needs.discover.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download changed articles into publishing paths
        if: needs.discover.outputs.has_builds == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: built-*
          merge-multiple: true
          path: .

      - name: Refresh homepage and series listings
        run: |
          python scripts/update_latest_articles.py
          python scripts/update_series_articles.py

      - name: Make a single publishing commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles index.html lfn/index.html mac/index.html rva/index.html mod/index.html est/index.html

          if git diff --cached --quiet; then
            echo "Generated articles and listings are already current."
            exit 0
          fi

          git commit -m "Publish updated articles and refresh listings"
          git pull --rebase origin main
          git push origin HEAD:main
