name: Update Peer-Reviewed Publications

on:
  push:
    branches: [main]
    paths:
      - "jpa/**"
      - ".github/workflows/update-jpa-publications.yml"
  pull_request:
    branches: [main]
    paths:
      - "jpa/**"
      - ".github/workflows/update-jpa-publications.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jpa-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate metadata and render publication cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate publication cards
        run: python3 jpa/update_publications.py
      - name: Verify committed HTML on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- jpa/index.html

  publish:
    name: Publish generated JPA index
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update JPA index
        run: python3 jpa/update_publications.py
      - name: Commit changes if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jpa/index.html
          if git diff --cached --quiet; then
            echo "JPA page already up to date."
            exit 0
          fi
          git commit -m "Refresh JPA publication cards"
          git pull --rebase origin main
          git push origin HEAD:main
